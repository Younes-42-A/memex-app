    <title>Memex</title>
    <!-- استدعاء CSS الخاص بـ Select2 لتفعيل خانة البحث -->

    <link rel="stylesheet" href="src/styles/tokens.css" />
    <link rel="stylesheet" href="src/styles/base.css" />
    <link rel="stylesheet" href="src/styles/components.css" />

<body>
    <main>
        <div class="container">
            <section class="brand-block" aria-labelledby="page-title">
                <div class="eyebrow">Memex</div>
                <h1 id="page-title">Welcome to <span class="highlight">Memex</span></h1>
                <p class="intro">
                    Build your own personal knowledge space and keep your notes, ideas, and important information organized in one place.
                </p>
                <div class="note">Can you fill in the blanks?</div>
            </section>

            <section class="form-card" aria-labelledby="login-title">
                <div class="auth-heading">
                    <div class="auth-mode-switch" role="group" aria-label="Choose an account action">
                        <button type="button" class="auth-mode-button is-active" data-mode="login" aria-pressed="true">Log in</button>
                        <button type="button" class="auth-mode-button" data-mode="signup" aria-pressed="false">Create account</button>
                    </div>
                    <h2 id="login-title">Welcome back</h2>
                    <p class="auth-subtitle" id="auth-subtitle">Log in to continue to your personal knowledge space.</p>
                </div>

                <form method="post" id="auth-form">
                    <div class="signup-field" hidden>
                        <label for="full-name">Full name</label>
                        <input type="text" id="full-name" name="fullName" placeholder="How should we call you?" autocomplete="name" required disabled />
                    </div>

                    <div class="signup-field" hidden>
                        <label for="email">Email address</label>
                        <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required disabled />
                    </div>

                    <div>
                        <label for="username">Username</label>
                        <input type="text" id="username" name="username" placeholder="Enter your username" autocomplete="username" required />
                    </div>

                    <div class="login-field">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" required />
                    </div>

                    <div class="signup-field" hidden>
                        <label for="new-password">Create a password</label>
                        <input type="password" id="new-password" name="newPassword" placeholder="At least 8 characters" autocomplete="new-password" minlength="8" required disabled />
                    </div>

                    <div class="signup-field" hidden>
                        <label for="confirm-password">Confirm password</label>
                        <input type="password" id="confirm-password" name="confirmPassword" placeholder="Enter your password again" autocomplete="new-password" required disabled />
                    </div>
